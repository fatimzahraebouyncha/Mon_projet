<!DOCTYPE html>

  <dialog class="modal" id="transactionDialog" aria-labelledby="transactionDialogTitle">
    <div class="modal-shell">
      <div class="modal-head">
        <div>
          <p class="modal-eyebrow" id="transactionDialogEyebrow">Nouvelle opération</p>
          <h2 id="transactionDialogTitle">Ajouter une transaction</h2>
        </div>
        <button type="button" class="icon-button" data-close-dialog="transactionDialog" aria-label="Fermer">
          <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
        </button>
      </div>
      <form id="transactionForm" novalidate>
        <input type="hidden" id="txId" name="tx-id">
        <div class="modal-body">
          <div class="type-toggle" role="group" aria-label="Type d’opération">
            <label class="type-option">
              <input type="radio" name="type" value="income" id="txTypeIncome" checked>
              <span class="type-option-inner">
                <span class="type-icon income"><svg class="icon" aria-hidden="true"><use href="#i-arrow-down-left"/></svg></span>
                <span><strong>Encaissement</strong><small>Vente, prestation…</small></span>
              </span>
            </label>
            <label class="type-option">
              <input type="radio" name="type" value="expense" id="txTypeExpense">
              <span class="type-option-inner">
                <span class="type-icon expense"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></span>
                <span><strong>Dépense</strong><small>Achat, loyer…</small></span>
              </span>
            </label>
          </div>

          <div class="form-grid">
            <label class="field field-span-2">
              <span>Libellé <em>*</em></span>
              <input type="text" name="label" id="txLabel" placeholder="Ex. Vente du jour, achat de riz…" required maxlength="80" autocomplete="off">
            </label>

            <label class="field">
              <span>Montant <em>*</em></span>
              <span class="input-suffix">
                <input type="number" name="amount" id="txAmount" placeholder="0" min="1" step="1" required inputmode="numeric">
                <span>FCFA</span>
              </span>
            </label>

            <label class="field">
              <span>Date <em>*</em></span>
              <input type="date" name="date" id="txDate" required>
            </label>

            <label class="field">
              <span>Catégorie</span>
              <select name="category" id="txCategory"></select>
            </label>

            <label class="field">
              <span>Moyen de paiement</span>
              <select name="method" id="txMethod">
                <option>Espèces</option>
                <option>Mobile Money</option>
                <option>Virement</option>
                <option>Chèque</option>
                <option>Autre</option>
              </select>
            </label>

            <label class="field field-span-2">
              <span>Client / fournisseur</span>
              <input type="text" name="party" id="txParty" placeholder="Ex. Restaurant Le Baobab, Grossiste Adjamé…" maxlength="80" autocomplete="off">
            </label>

            <label class="field field-span-2">
              <span>Note <small>(facultatif)</small></span>
              <textarea name="note" id="txNote" rows="2" placeholder="Un détail à retenir sur cette opération…" maxlength="240"></textarea>
            </label>
          </div>
          <p class="form-error" id="txFormError" role="alert" hidden></p>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-danger-ghost" id="txDeleteButton" data-action="delete-transaction" hidden>
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg> Supprimer
          </button>
          <span class="modal-foot-spacer"></span>
          <button type="button" class="btn btn-secondary" data-close-dialog="transactionDialog">Annuler</button>
          <button type="submit" class="btn btn-primary" id="txSubmitButton">Enregistrer l’opération</button>
        </div>
      </form>
    </div>
  </dialog>

    <div class="modal-shell">
